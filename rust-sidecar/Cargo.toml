[package]
name = "rg-check-engine"
version = "0.2.0"
edition = "2021"
description = "RG-Check Compliance Engine - Cryptographically-signed responsible gambling risk detection"
license = "MIT"
authors = ["SecuraMem (17342926 Canada Inc.)"]
repository = "https://github.com/securamem/rg-check-engine"
keywords = ["igaming", "responsible-gambling", "compliance", "agco", "rg-check"]

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "rg-check-server"
path = "src/main.rs"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1.0", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "compression-gzip"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client for Claude API
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Validation
validator = { version = "0.18", features = ["derive"] }

# Rate limiting
governor = "0.6"

# Caching
moka = { version = "0.12", features = ["future"] }

# Text processing
regex = "1.10"
once_cell = "1.19"
unicode-segmentation = "1.11"

# Cryptography - Ed25519 signing (SecuraMem core)
ed25519-dalek = { version = "2.1", features = ["pkcs8", "pem", "rand_core"] }
pkcs8 = { version = "0.10", features = ["pem"] }
signature = "2.2"
ring = "0.17"
rand_core = { version = "0.6", features = ["getrandom"] }

# Hashing
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"

# Database - SQLite for immutable audit log
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
futures = "0.3"

# Environment & config
dotenvy = "0.15"

# Logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Metrics
metrics = "0.23"
metrics-exporter-prometheus = "0.15"

# UUID for request IDs & receipt IDs
uuid = { version = "1.11", features = ["v4", "serde"] }

# Time - RFC 3339 timestamps (AGCO 3.12)
chrono = { version = "0.4", features = ["serde"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }

[dev-dependencies]
tokio-test = "0.4"
criterion = { version = "0.5", features = ["html_reports"] }
once_cell = "1.19"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
